services:
  postgres:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-express_rest_api_boilerplate}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASS:-development-only-password}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
  postgres-test:
    image: postgres:16.15-bookworm
    profiles: [test]
    environment:
      POSTGRES_DB: express_rest_api_boilerplate_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: development-test-only-password
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
